name: Civilians
version: '${version}'
main: com.thecoberto.civilians.CiviliansPlugin
api-version: '1.21'
description: Civilians and adventure zones, where players can't hurt each other. Use /team for teams.
author: TheCoberto
softdepend: [PlaceholderAPI]
commands:
  civilian:
    description: Become a civilian (no PvP either way) or stop being one. Admins can set it for others.
    usage: /civilian [join|leave|menu] or /civilian <players> <true|false>
  civilians:
    description: List the civilians online
    usage: /civilians
permissions:
  civilians.admin:
    description: Make players civilians
    default: op
  civilians.self:
    description: Become a civilian or stop being one with /civilian join|leave
    default: true
